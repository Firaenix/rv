name: Release-plz

# Proposes the version bump and the changelog as a PR; merging that PR pushes
# the `vX.Y.Z` tag, which is what `release.yml` (generated by `dist`) triggers
# on to build and publish the binaries.
#
# Both jobs authenticate with the RELEASE_PLZ_TOKEN PAT rather than the
# automatic GITHUB_TOKEN, because GitHub suppresses workflow triggers on
# events created with the automatic token: a tag pushed with it would never
# start release.yml, and a release PR opened with it would never get CI.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Firaenix' }}
    permissions:
      # Push the tag.
      contents: write
      # Detect the release PR and its commits.
      pull-requests: read
    steps:
      - name: Require the release token
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLZ_TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set. release-plz reports this as an empty GITHUB_TOKEN, which reads like a bug in the action rather than a missing secret. Add a fine-grained PAT scoped to this repository with Contents and Pull requests read/write." >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The whole history: the release is cut from the release PR's latest
          # commit, and the changelog is built from the commits since the last
          # tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Firaenix' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require the release token
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLZ_TOKEN}" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set. release-plz reports this as an empty GITHUB_TOKEN, which reads like a bug in the action rather than a missing secret. Add a fine-grained PAT scoped to this repository with Contents and Pull requests read/write." >&2
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
