name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # The dev shell already pins the toolchain plus the two binaries the
      # suite spawns as processes: `jj`, which builds a repository per fixture,
      # and `difft`, which is the diff engine the fallback exists to stand in
      # for. Installing them separately here would be a second declaration of
      # the same set, free to drift from the one a contributor actually runs.
      - name: Check the dev shell provides the toolchain
        run: nix develop --command bash -c 'cargo --version && jj --version && difft --version'

      - run: nix develop --command cargo fmt --all --check
      - run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings
      - name: build tests
        run: nix develop --command cargo test --workspace --no-run
      - name: run highlight test 15x (parallel) with log
        shell: bash
        run: |
          set +e
          fails=0
          for i in $(seq 1 15); do
            echo "=== iter $i parallel ==="
            rm -f /tmp/highlight-segv.log
            nix develop --command cargo test -p rv-core --test highlight 2>&1 | tail -5
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              fails=$((fails+1))
              echo "iter $i FAILED rc=$rc; log tail:"
              tail -n 30 /tmp/highlight-segv.log
              echo "--- log tail end ---"
            fi
          done
          echo "parallel failures: $fails / 15"
      - name: run rest of tests
        run: nix develop --command cargo test --workspace

  package:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build --print-build-logs
      # The flake wraps difftastic onto the binary's PATH; a package that
      # cannot report its own version is not one worth publishing.
      - run: ./result/bin/rv --version
