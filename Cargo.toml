[workspace]
members = ["rv-core", "rv"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
jj-lib = { version = "0.44", features = ["git"] }
pollster = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2"
tempfile = "3"
thiserror = "2"
toml = "0.9"
