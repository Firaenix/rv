[package]
name = "rv"
description = "jj-native terminal branch reviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../README.md"
keywords = ["jujutsu", "jj", "code-review", "tui", "diff"]
categories = ["command-line-utilities", "development-tools"]

# Both a library and a binary: the library is where `session`, `app` and `ui`
# live so they can be unit tested, and the named binary target is what gives
# integration tests `CARGO_BIN_EXE_rv`.
[lib]
name = "rv"
path = "src/lib.rs"

[[bin]]
name = "rv"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Comment ids are a short blake3 digest of the location and body they cover.
blake3.workspace = true
clap.workspace = true
# The terminal stack. Unused until the TUI lands; declared here so the crate's
# dependency set does not churn when it does.
crossterm = "0.29"
ratatui = "0.30"
rv-core = { path = "../rv-core", version = "1.2.0" }
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
tempfile.workspace = true
