# release-plz owns the version, the changelog and the tag. `dist`'s
# release.yml triggers on the tag release-plz pushes and owns everything after
# it: the binaries, the installers, the Homebrew formula and the GitHub
# release. Neither tool decides a version, so there is one source of truth.

[workspace]
# NOT `publish = false`. That still asks crates.io what the latest version is,
# and the name `rv` there belongs to an unrelated project (promised-ai/rv,
# currently 0.20.1) — release-plz would read that as this project's released
# version and propose 0.20.2. `git_only` takes the version from our own tags
# and skips `cargo publish` entirely, which is the honest description of how
# this project is distributed: binaries, Homebrew and Nix.
git_only = true

git_tag_name = "v{{ version }}"

# `dist` writes the GitHub release, uploads the artifacts and fills in the
# body from this changelog. A release-plz release for the same tag would race
# it.
git_release_enable = false

# Release when Cargo.toml's version differs from the last git tag on any
# push to master, not only when the automated release PR merges. That
# matters after a failed release: without this, the retry has to route
# through another release PR (there is nothing to bump, so there is nothing
# for release-plz PR mode to open), and the tag stays unpushed until the
# next real version bump. `release_always = true` still only cuts a tag
# when the version has actually moved forward — release-plz refuses to
# re-tag the current version — so it does not cause spam. `dist`'s release
# workflow still owns the binaries/formula/GitHub release and is triggered
# by the tag alone, so the source of truth is unchanged.
release_always = true

[[package]]
name = "rv-core"
# It ships inside the `rv` binary and is not separately consumable, so it gets
# no tag of its own. Both crates take `version.workspace`, so they cannot
# drift regardless.
git_tag_enable = false
# Explicit at the package level, not just the workspace level: release-plz
# 0.3.160's PackageConfig -> ReleaseConfig conversion at
# `crates/release-plz/src/config.rs:331` computes `is_publish_enabled =
# value.publish != Some(false)` and consults `publish` only — never `git_only`
# — when deciding whether to run `cargo publish`. So workspace `git_only =
# true` correctly merges into rv-core's PackageConfig, but with `publish`
# unset (None) the boolean resolves to `true` and release-plz runs `cargo
# publish rv-core` anyway. This blocked the v1.1.0 release on 2026-08-21
# ("no token found, please run cargo login") because rv-core has never been
# published and there is no CARGO_REGISTRY_TOKEN. `publish = false` is the
# load-bearing line; `git_only = true` is defensive redundancy in case the
# conversion bug is patched upstream and the field is finally consulted.
publish = false
git_only = true

[[package]]
name = "rv"
# Same story as `rv-core` immediately above: release-plz 0.3.160 ignores
# `git_only` when deciding whether to run `cargo publish`, so `publish = false`
# has to be explicit at the package level or the release job crashes on
# `cargo publish rv` with "no token found". `rv` on crates.io is an unrelated
# project (promised-ai/rv, 0.20.1) so publishing here would be wrong even if
# a token were configured; the ship path is binaries + Homebrew + Nix, driven
# by the tag release-plz pushes and picked up by dist's `release.yml`.
publish = false
git_only = true

[changelog]
# A commit whose body says it breaks something is never dropped from the
# changelog by a filter above it.
protect_breaking_commits = true
