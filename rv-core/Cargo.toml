[package]
name = "rv-core"
description = "Terminal-free core of rv: jj-lib access, diffs, anchors and .review/ I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["development-tools"]

[dependencies]
blake3.workspace = true
futures.workspace = true
jj-lib.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
# Regular (not dev-only) dependency: diff production writes blobs to temp files
# so that difftastic, which takes paths rather than stdin, can read them.
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
# Syntax highlighting is produced here, as plain data. The grammars and the
# highlighter live in this crate; the mapping from a capture class to a
# terminal colour lives in `rv`, so this crate stays terminal-free.
# `tree-sitter` itself is not a direct dependency: nothing here names a
# `tree_sitter` type, so it arrives once, transitively, under the highlighter.
# Each grammar below is one row in `GRAMMARS` in `src/highlight.rs` and one
# test in `tests/highlight.rs`; a grammar with neither is dead weight in the
# binary, and every one of these is a C parser compiled into it.
tree-sitter-bash.workspace = true
tree-sitter-go.workspace = true
tree-sitter-highlight.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-md.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
# Symbol extraction (`src/symbols.rs`), over the same grammar crates listed
# here. Six of the eleven ship a `tags.scm`; the other five are highlighted and
# have no symbols, which `tests/symbols.rs` pins.
tree-sitter-tags.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true
